---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler-status-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cluster-autoscaler-status-exporter

---
# The exporter only ever reads the single status ConfigMap, which the
# cluster-autoscaler maintains in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler-status-exporter
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cluster-autoscaler-status-exporter
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["cluster-autoscaler-status"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler-status-exporter
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cluster-autoscaler-status-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler-status-exporter
subjects:
- kind: ServiceAccount
  name: cluster-autoscaler-status-exporter
  namespace: monitoring

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler-status-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cluster-autoscaler-status-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-autoscaler-status-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-autoscaler-status-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: cluster-autoscaler-status-exporter
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: exporter
        image: ghcr.io/bringg/cluster_autoscaler_status_exporter:latest
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 10m
            memory: 25Mi
          limits:
            memory: 50Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
